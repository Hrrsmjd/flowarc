[project]
name = "flowarc"
version = "0.1.0"
description = "An autonomous agent that never stops making physics training data."
requires-python = ">=3.14"
dependencies = [
    "numpy",
    "scipy",
    "google-genai>=2.3.0",   # Gemini 4 Argon (orchestration) + nano banana (image gen)
    "pymongo>=4.8",          # MongoDB Atlas
    "pillow",                # handle generated images
    "requests",              # call the image-to-3D endpoint (Hunyuan3D)
    "trimesh",               # mesh validity + repair (watertight / manifold)
    "meshio",                # mesh IO
    "python-dotenv",
    "tqdm",
]

[project.optional-dependencies]
# image-to-3D via hosted endpoint (pick one when you know how you're running Hunyuan3D)
mesh3d = ["replicate"]
# voxelisation + viz
viz = ["pyvista"]
# faster lattice-Boltzmann solve
accel = ["numba"]
# vector-search embeddings
embed = ["voyageai"]
dev = ["ruff", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generator", "solver", "pipeline", "store"]

[tool.ruff]
line-length = 100
target-version = "py314"
