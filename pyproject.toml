[project]
name = "flowarc"
version = "0.1.0"
description = "An agent that builds a shape-diverse dataset of turbulent 3D flow simulations."
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "google-genai>=2.30.1",
    "pydantic>=2",
    "pillow",
    "trimesh",
    "rtree",
    "manifold3d",
    "scikit-image",
    "zarr>=3",
    "python-dotenv",
    "pymongo>=4.8",
]

[project.optional-dependencies]
dev = ["ruff", "pytest", "mongomock"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flowarc"]

[tool.ruff]
line-length = 100
target-version = "py312"
